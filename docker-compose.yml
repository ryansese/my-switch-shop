services:
  shop:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: my-switch-shop
    restart: unless-stopped
    ports:
      - "${SHOP_PORT:-8080}:8080"
    environment:
      SHOP_MESSAGE: ${SHOP_MESSAGE:-Welcome to my Switch shop}
    volumes:
      - ${GAMES_DIR:-/games}:/games:ro
